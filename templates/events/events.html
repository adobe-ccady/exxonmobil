<head>
  <title>{{title}} | Upcoming Events</title>
  <meta name="description" content="{{description}}">
  <meta name="date" content="{{occurrenceDate}}">
  <meta name="keywords" content="events, upcoming-events">
  <meta name="template" content="events">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [{
      "@type": "Event",
      "name": "{{title}}",
      "description": "{{description}}",
      "startDate": "{{occurrenceDate}}",
      "eventStatus": "https://schema.org/EventScheduled",
      "location": {
        "@type": "Place",
        "name": "{{location}}",
        "address": "{{address}}"
      },
      "organizer": {
        "@type": "Organization",
        "name": "ExxonMobil",
        "url": "https://main--exxonmobil--adobe-ccady.aem.live"
      }
    }]
  }
  </script>
</head>
<body>
  <header></header>
  <main>
    <div>
      <div class="hero">
        <div>
          <div>
            <picture>
              <source
                type="image/webp"
                srcset="https://main--exxonmobil--adobe-ccady.aem.live/media/xom/baytown-employee-pictures-sc-landscape-2880x1620.jpg?width=2000&format=webply&optimize=medium"
                media="(min-width: 600px)"
              >
              <source
                type="image/webp"
                srcset="https://main--exxonmobil--adobe-ccady.aem.live/media/xom/baytown-employee-pictures-sc-landscape-2880x1620.jpg?width=750&format=webp&optimize=medium"
              >
              <source
                type="image/jpeg"
                srcset="https://main--exxonmobil--adobe-ccady.aem.live/media/xom/baytown-employee-pictures-sc-landscape-2880x1620.jpg?width=2000&format=jpg&optimize=medium"
                media="(min-width: 600px)"
              >
              <img
                loading="lazy"
                alt="ExxonMobil employees at the Baytown, Texas site"
                src="https://main--exxonmobil--adobe-ccady.aem.live/media/xom/baytown-employee-pictures-sc-landscape-2880x1620.jpg?width=750&format=jpg&optimize=medium"
                width="1600"
                height="900"
              >
            </picture>
          </div>
        </div>
        <div>
          <div>
            <h1 id="{{id}}">{{title}}</h1>
          </div>
        </div>
      </div>
      <div class="columns">
        <div>
          <div>
            <p>{{description}}</p>
            {{#details}}<p>{{details}}</p>{{/details}}
            <p>Type : {{type}}</p>
            <p>Date : {{occurrenceDate}}</p>
            <p>Time : {{time}}</p>
          </div>
        </div>
      </div>
      <div class="section-metadata">
        <div>
          <div>Style</div>
          <div>divider, center</div>
        </div>
      </div>
    </div>
    <div>
      <h2 id="other-events">Other Events</h2>
      <div class="related-articles">
        <div>
          <div>keywords</div>
          <div>events</div>
        </div>
      </div>
    </div>
  </main>
  <footer></footer>
</body>
